# nginx's bundled mime.types has no entry for .mjs, so it falls back to
# application/octet-stream. Chrome refuses module scripts served with that type,
# which is what broke the pdf.js worker in production while dev was fine.
types {
    application/javascript  mjs;
}

server {
    listen 80;
    server_name sv.gridsphere.in;

    # Frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://coursevault-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # nginx defaults to a 1MB request body and rejects anything larger with
        # 413 before it ever reaches Node. Uploads are 8MB chunks, and the
        # single-request path still carries files up to 50MB.
        client_max_body_size 100m;

        # Buffering a large upload to disk before forwarding adds latency and
        # disk churn for no benefit; stream it straight through.
        proxy_request_buffering off;

        # A slow connection pushing a chunk must not be cut off mid-transfer.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Video is served with byte ranges; buffering the response would
        # defeat seeking.
        proxy_buffering off;
    }
}
