services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coursevault-backend
    restart: always
    environment:
      # These will be read from a .env file on your VPS
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      # Password-reset email. Leave unset and reset codes are printed to the
      # container log instead of being sent — the flow still works end to end,
      # which is useful for testing before a mail provider is set up.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # Comma-separated addresses that sign in without the emailed code.
      # Each one is an account a stolen password alone opens, so keep the list
      # short and remove entries once the reason for them has passed. The
      # backend prints the list at boot.
      - TWO_FACTOR_EXEMPT_EMAILS=${TWO_FACTOR_EXEMPT_EMAILS}
    ports:
      - "3000:3000"
    volumes:
      # Persist temp videos so they survive container restarts during processing
      - temp_videos:/app/temp_videos

  frontend:
    build:
      context: ./coursevault-frontend
      dockerfile: Dockerfile
      args:
        # Pass the public URL of your backend API
        - VITE_API_URL=https://sv.gridsphere.in/api
    container_name: coursevault-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  temp_videos:
